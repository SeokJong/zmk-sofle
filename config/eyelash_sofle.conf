# =====================================================
# ZMK 키보드 설정 파일
# Eyelash Sofle 분리형 키보드용
# =====================================================

# -----------------------------------------------------
# 절전 모드 설정
# -----------------------------------------------------
# 1시간(3600000ms = 60분 × 60초 × 1000ms) 후 절전 모드 진입
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 절전 모드 활성화
CONFIG_ZMK_SLEEP=y

# -----------------------------------------------------
# 디버깅 설정 (필요시 주석 해제)
# -----------------------------------------------------
# USB 로깅 활성화
# CONFIG_ZMK_USB_LOGGING=n

# -----------------------------------------------------
# 클럭 설정
# -----------------------------------------------------
# Copyright (c) 2022 Darryl deHaan
# SPDX-License-Identifier: MIT

# 32kHz 크리스탈 활성화 (저전력 모드용)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# -----------------------------------------------------
# RGB 언더글로우 설정
# -----------------------------------------------------
# WS2812 LED 스트립 드라이버 활성화
CONFIG_WS2812_STRIP=y

# RGB 언더글로우 기능 활성화
CONFIG_ZMK_RGB_UNDERGLOW=y

# 외부 전원으로 RGB 제어
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# 시작 시 RGB 꺼짐 (배터리 절약)
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# RGB 최대 밝기 90%
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90

# 유휴 상태에서 RGB 자동 꺼짐
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# USB 분리 시 RGB 자동 꺼짐
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# 시작 시 RGB 색상 (160 = 청록색)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160

# 시작 시 RGB 효과 (3번 효과)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# -----------------------------------------------------
# HID 설정 (필요시 주석 해제)
# -----------------------------------------------------
# 기본 미디어 키만 사용 (호환성 향상)
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# -----------------------------------------------------
# 로터리 인코더 설정 (EC11)
# -----------------------------------------------------
# EC11 로터리 인코더 활성화
CONFIG_EC11=y

# 글로벌 스레드에서 인코더 트리거 처리
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# -----------------------------------------------------
# 외부 전원 설정
# -----------------------------------------------------
# 외부 전원 제어 활성화 (RGB, 디스플레이 등)
CONFIG_ZMK_EXT_POWER=y

# -----------------------------------------------------
# 마우스/포인팅 장치 설정
# -----------------------------------------------------
# 마우스 에뮬레이션 활성화
CONFIG_ZMK_POINTING=y

# -----------------------------------------------------
# 블루투스 설정
# -----------------------------------------------------
# 블루투스 송신 전력 +8dBm (더 넓은 범위)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# NKRO (N-Key Rollover) 비활성화
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# -----------------------------------------------------
# 백라이트 설정
# -----------------------------------------------------
# 백라이트 기능 활성화
CONFIG_ZMK_BACKLIGHT=y

# 시작 시 백라이트 밝기 100%
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# 시작 시 백라이트 켜짐
CONFIG_ZMK_BACKLIGHT_ON_START=y

# 유휴 시 백라이트 자동 꺼짐 비활성화
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# -----------------------------------------------------
# 키 스캔 디바운스 설정
# -----------------------------------------------------
# 키 누름 디바운스 시간 8ms
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8

# 키 해제 디바운스 시간 8ms
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# -----------------------------------------------------
# 소프트 오프 설정
# -----------------------------------------------------
# 소프트 오프 기능 활성화 (Q+S+Z 키로 딥 슬립 진입)
CONFIG_ZMK_PM_SOFT_OFF=y
